name: Deploy weather dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run tests
        run: python3 scripts/test.py
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html diagnostic.html _site/
          cp -R assets _site/assets
          mkdir -p _site/radar
          cp radar/index.html radar/app.js radar/radar.js radar/places.js radar/radar.css _site/radar/
          cp radar/basemap.svg radar/basemap-z5.svg radar/basemap-z6.svg _site/radar/
          mkdir -p _site/certificates
          cp certificates/isrg-root-x1.cer _site/certificates/
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
